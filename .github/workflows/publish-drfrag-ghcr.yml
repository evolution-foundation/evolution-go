name: Publish Drfrag Evolution Go

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: drfrag-evolution-go-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/integration-pr237-pr233'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION 2>/dev/null | tr -d '\r\n' || true)"
          if [ -z "$VERSION" ]; then
            VERSION="integrated-0a4b9ff"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drfrag/evolution-go
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publication summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Drfrag Evolution Go published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/drfrag/evolution-go" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
