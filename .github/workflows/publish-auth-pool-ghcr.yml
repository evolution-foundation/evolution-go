name: Verify and publish auth pool fix

on:
  push:
    branches:
      - codex/fix-auth-pool

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev libwebp-dev
      - name: Test all packages
        run: go test ./...
      - name: Check auth store concurrency
        run: go test -race ./pkg/whatsmeow/service -run 'Test(AuthContainer|PostgresAuthContainer)' -count=1
      - name: Build server
        run: go build ./cmd/evolution-go

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit-tagged image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jadercarvalhoprm/evolution-go-auth-pool:0.7.2-${{ github.sha }}
          build-args: VERSION=0.7.2-authpool-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: echo 'ghcr.io/jadercarvalhoprm/evolution-go-auth-pool@${{ steps.build.outputs.digest }}'
