name: Build and Publish Docker Image

# Fork Torêva: publica no GHCR (ghcr.io/us-aitech/toreva-go) em vez do Docker
# Hub do upstream. Só arm64, num runner arm64 nativo: os nós do EKS são arm64.
# O deploy é pelo leads-mining-infra, que fixa a tag + digest gerados aqui em
# helm/evolution-go/values.yaml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_deploy:
    name: Build and Publish
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      # Tag com o commit: o values.yaml do infra fixa uma tag que nunca muda de imagem.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ github.sha }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Image digest
        run: |
          echo "${{ steps.docker_build.outputs.digest }}"
          {
            echo "### Imagem publicada"
            echo
            echo "- tag: \`${{ steps.version.outputs.version }}-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.docker_build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
